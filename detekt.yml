coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
  SleepInsteadOfDelay:
    active: true
  SuspendFunWithFlowReturnType:
    active: true

complexity:
  LargeClass:
    active: true
    allowedLines: 400
  ComplexInterface:
    active: true
    allowedDefinitions: 6
  ComplexCondition:
    allowedConditions: 5
  TooManyFunctions:
    allowedFunctionsPerClass: 25
    allowedFunctionsPerFile: 30
    allowedFunctionsPerObject: 11
  NestedScopeFunctions:
    active: true
    allowedDepth: 2
  LongMethod:
    active: true
    allowedLines: 60
    ignoreAnnotated: [ 'Test' ]
  StringLiteralDuplication:
    active: true
    allowedDuplications: 2
    ignoreStringsRegex: '\b(Not yet implemented|default)\b'
    excludes:
      - '**/test/**'
  ReplaceSafeCallChainWithRun:
    active: false
  LongParameterList:
    active: false

exceptions:
  TooGenericExceptionCaught:
    allowedExceptionNameRegex: '_|(ignore|expected|logging|transient).*'
  ObjectExtendsThrowable:
    active: true

ktlint:
  AnnotationOnSeparateLine:
    active: true
  AnnotationSpacing:
    active: true
  ArgumentListWrapping:
    active: true
    maxLineLength: 140
  BlockCommentInitialStarAlignment:
    active: true
  CommentWrapping:
    active: true
  DiscouragedCommentLocation:
    active: true
  EnumEntryNameCase:
    active: true
  FunctionTypeReferenceSpacing:
    active: true
  FunKeywordSpacing:
    active: true
  KdocWrapping:
    active: true
  ModifierListSpacing:
    active: true
  Indentation:
    indentSize: 4
  MultiLineIfElse:
    active: true
  PackageName:
    active: true
  SpacingAroundAngleBrackets:
    active: true
  SpacingAroundDoubleColon:
    active: true
  SpacingAroundUnaryOperator:
    active: true
  SpacingBetweenDeclarationsWithAnnotations:
    active: true
  SpacingBetweenDeclarationsWithComments:
    active: true
  TypeArgumentListSpacing:
    active: true
  UnnecessaryParenthesesBeforeTrailingLambda:
    active: true
  NoEmptyFirstLineInMethodBlock:
    active: true
  NoWildcardImports:
    active: true
    packagesToUseImportOnDemandProperty: ''
  MaximumLineLength:
    maxLineLength: 140
  ParameterListWrapping:
    active: true
    maxLineLength: 140
    autoCorrect: true
    indentSize: 4
  NoMultipleSpaces:
    active: true
    autoCorrect: true

naming:
  BooleanPropertyNaming:
    active: true
    allowedPattern: '^(is|has|are|should)'
    # `deprecated` and `required` are the names OpenAPI gives these fields, and both the spec models
    # and the DSL that fills them in are read next to the specification.
    excludes:
      - '**/Components.kt'
      - '**/Operation.kt'
      - '**/OperationBuilder.kt'
  ConstructorParameterNaming:
    active: true
    excludeClassPattern: 'SchemaObject|ParameterObject|SecuritySchemeObject|PathItemObject'
  ForbiddenClassName:
    active: true
    forbiddenName:
      - 'Service'
  FunctionNameMaxLength:
    active: true
    maximumFunctionNameLength: 40
    excludes:
      - '**/test/**'
  FunctionNameMinLength:
    active: true
    minimumFunctionNameLength: 2
  LambdaParameterNaming:
    active: true
  VariableMaxLength:
    active: true
  VariableMinLength:
    active: true
    minimumVariableNameLength: 2
  NonBooleanPropertyPrefixedWithIs:
    active: true

performance:
  CouldBeSequence:
    active: true
    allowedOperations: 3
  SpreadOperator:
    active: true

potential-bugs:
  CastToNullableType:
    active: true
  DontDowncastCollectionTypes:
    active: true
  ElseCaseInsteadOfExhaustiveWhen:
    active: true
  ExitOutsideMain:
    active: true
  ImplicitUnitReturnType:
    active: false
  MissingPackageDeclaration:
    active: true
  NullableToStringCall:
    active: true
  NullCheckOnMutableProperty:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true
  UnsafeCallOnNullableType:
    active: false

style:
  CanBeNonNullable:
    active: true
  ClassOrdering:
    active: true
  CollapsibleIfStatements:
    active: true
  DataClassContainsFunctions:
    active: true
  DataClassShouldBeImmutable:
    active: false
  EqualsOnSignatureLine:
    active: true
  ExplicitCollectionElementAccessMethod:
    active: true
  MaxLineLength:
    active: false
    maxLineLength: 140
  ForbiddenImport:
    active: true
    forbiddenImports: []
  ForbiddenMethodCall:
    active: true
    methods: []
  ForbiddenVoid:
    active: true
  MagicNumber:
    active: true
    ignoreRanges: true
    ignorePropertyDeclaration: true
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
      - '3'
      - '403'
      - '422'
      - '200'
    excludes:
      - '**/test/**'
  NoTabs:
    active: true
  NullableBooleanCheck:
    active: true
  OptionalUnit:
    active: true
  BracesOnWhenStatements:
    active: true
    singleLine: 'necessary'
    multiLine: 'necessary'
  RedundantExplicitType:
    active: true
  RedundantVisibilityModifier:
    active: true
  SpacingAfterPackageAndImports:
    active: true
  TrailingWhitespace:
    active: true
  UnderscoresInNumericLiterals:
    active: true
    acceptableLength: 5
  UnnecessaryBackticks:
    active: true
  UnnecessaryInnerClass:
    active: true
  UnnecessaryLet:
    active: true
  UnnecessaryParentheses:
    active: true
  RangeUntilInsteadOfRangeTo:
    active: true
  UnusedImport:
    active: true
    # `io.ktor.server.response.respond` is reported as unused in the verb DSL files, where
    # `call.respond` also matches a member of `ApplicationCall` that takes an explicit `typeInfo`.
    # Dropping the import makes the call resolve to that member and the files stop compiling, so the
    # rule is only excluded there.
    excludes:
      - '**/ktor/{Get,Post,Put,Patch,Delete}.kt'
  UseDataClass:
    active: true
  UseIfEmptyOrIfBlank:
    active: true
  UseIfInsteadOfWhen:
    active: true
  ReturnCount:
    active: false
  WildcardImport:
    active: true
  AbstractClassCanBeConcreteClass:
    active: false
  AbstractClassCanBeInterface:
    active: false
